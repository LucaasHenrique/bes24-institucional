services:
  app:
    networks:
      - default
      - traefik-public
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-public
      traefik.http.routers.bes24-secure.entrypoints: websecure
      traefik.http.routers.bes24-secure.rule: Host(`bes2024.olua.me`)
      traefik.http.routers.bes24-secure.tls: "true"
      traefik.http.services.bes24.loadbalancer.server.port: "3000"

networks:
  traefik-public:
    external: true
